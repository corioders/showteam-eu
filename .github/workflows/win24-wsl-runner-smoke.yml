name: win24-wsl runner smoke

on:
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    runs-on: [self-hosted, win24-wsl]
    timeout-minutes: 10
    steps:
      - name: Verify isolated Linux runner and job Docker
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test ! -e /home/wiktor
          test "$(docker info --format '{{.OSType}}')" = linux
          docker version
