name: win24-wsl idle sleep smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, win24-wsl]
    timeout-minutes: 10
    steps:
      - name: Keep worker busy across sleep task ticks
        run: |
          test "$(uname -s)" = Linux
          sleep 90
          docker info --format '{{.OSType}}' | grep -qx linux
