# Deploys template.cfworkers to Cloudflare Workers.
# Pull requests upload an isolated preview and deploy the latest build to a shared
# Worker with observable logs; the 'deploy' branch publishes production.
#
# bootstrap_project.sh provisions Infisical + GitHub OIDC, Cloudflare cache
# resources, the deploy token in Infisical staging/prod, and Wrangler bindings.
#
# Validation and deploy run together on the isolated `win24-wsl` organization runner.
# The source template repository skips this workflow; initialized project
# repositories run it normally.

name: Deploy

on:
  push:
    branches:
      - deploy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-template:
    if: github.repository == 'corioders/cstd-nextjs-template'
    uses: ./.github/workflows/validate.yml

  deploy:
    if: github.repository != 'corioders/cstd-nextjs-template'
    runs-on: [self-hosted, win24-wsl]
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'deploy' && 'production' || 'preview' }}
    env:
      DEPLOY_REF: ${{ github.head_ref || github.ref_name }}
      PREVIEW_ALIAS: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
      PNPM_STORE_PATH: ${{ github.workspace }}/../../.pnpm-store
    concurrency:
      group: ${{ github.ref_name == 'deploy' && format('deploy-production-{0}', github.run_id) || 'deploy-shared-preview' }}
      cancel-in-progress: ${{ github.ref_name != 'deploy' }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          clean: false
          sparse-checkout: |
            .github
            template.cfworkers

      - name: Setup Node.js
        if: runner.environment != 'self-hosted'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        if: runner.environment != 'self-hosted'
        run: corepack enable

      - name: Restore Turborepo cache
        if: runner.environment != 'self-hosted'
        id: restore-turbo
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: template.cfworkers/.turbo
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-deploy-${{ github.ref_name }}-${{ hashFiles('template.cfworkers/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-deploy-${{ github.ref_name }}-${{ hashFiles('template.cfworkers/pnpm-lock.yaml') }}-
            ${{ runner.os }}-${{ runner.arch }}-turbo-validate-${{ hashFiles('template.cfworkers/pnpm-lock.yaml') }}-${{ github.sha }}
            ${{ runner.os }}-${{ runner.arch }}-turbo-

      - name: Restore Next.js cache
        if: runner.environment != 'self-hosted'
        id: restore-next
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: template.cfworkers/apps/web/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('template.cfworkers/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('template.cfworkers/pnpm-lock.yaml') }}-
            ${{ runner.os }}-${{ runner.arch }}-nextjs-

      - name: Install dependencies
        run: |
          INSTALL_INPUTS_HASH=$(
            {
              git ls-files --stage -- pnpm-lock.yaml pnpm-workspace.yaml .npmrc ':(glob)**/package.json' ':(glob)patches/**'
              node --version
              pnpm --version
            } | sha256sum | cut -d' ' -f1
          )
          INSTALL_MARKER="node_modules/.ci-install-${INSTALL_INPUTS_HASH}"
          if [[ "${{ runner.environment }}" == "self-hosted" && -f "$INSTALL_MARKER" ]]; then
            exit 0
          fi
          pnpm install --frozen-lockfile --prefer-offline --store-dir "$PNPM_STORE_PATH"
          if [[ "${{ runner.environment }}" == "self-hosted" ]]; then
            touch "$INSTALL_MARKER"
          fi
        working-directory: template.cfworkers

      - name: Use persistent Next.js cache
        run: |
          CACHE_DIRECTORY="/home/runner/_work/.build-cache/next/${GITHUB_REPOSITORY//\//-}"
          mkdir --parents "$CACHE_DIRECTORY" template.cfworkers/apps/web/.next
          ln --symbolic --force --no-dereference "$CACHE_DIRECTORY" template.cfworkers/apps/web/.next/cache

      - name: Fetch deployment secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ github.event.repository.name }}
          env-slug: ${{ github.ref_name == 'deploy' && 'prod' || 'staging' }}
          domain: ${{ vars.INFISICAL_DOMAIN }}

      - name: Resolve external build inputs
        run: pnpm resolve-build-inputs
        working-directory: template.cfworkers

      - name: Validate, build, and run browser tests
        run: pnpm validate:ci
        working-directory: template.cfworkers

      - name: Check deployed preview
        if: github.ref_name != 'deploy'
        id: preview-cache
        run: |
          WORKER_BUILD_HASH=$(pnpm --workspace-root turbo run build:worker --filter=web --dry=json 2>/dev/null | jq --exit-status --raw-output '.tasks[] | select(.task == "build:worker") | .hash')
          MARKER_DIRECTORY="/home/runner/_work/.build-cache/deploy/${GITHUB_REPOSITORY//\//-}/${PREVIEW_ALIAS}"
          MARKER_FILE="$MARKER_DIRECTORY/current.json"
          SHARED_MARKER_FILE="${MARKER_DIRECTORY%/*}/shared-current-version"
          {
            echo "worker_build_hash=$WORKER_BUILD_HASH"
            echo "marker_file=$MARKER_FILE"
            echo "shared_marker_file=$SHARED_MARKER_FILE"
          } >> "$GITHUB_OUTPUT"

          if [[ -f "$MARKER_FILE" ]] \
            && jq --exit-status --arg hash "$WORKER_BUILD_HASH" '.worker_build_hash == $hash and (.version_id | length > 0)' "$MARKER_FILE" >/dev/null
          then
            VERSION_ID=$(jq -r .version_id "$MARKER_FILE")
            ALIAS_URL=$(jq -r .alias_url "$MARKER_FILE")
            HTTP_STATUS=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 1 --retry-max-time 30 --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/template-cfworkers-web-preview/versions/$VERSION_ID" || true)
            if [[ "$HTTP_STATUS" == "200" ]]; then
              SHARED_CURRENT=false
              if [[ -f "$SHARED_MARKER_FILE" && "$(<"$SHARED_MARKER_FILE")" == "$VERSION_ID" ]]; then
                SHARED_CURRENT=true
              fi
              {
                echo "cache_hit=true"
                echo "shared_current=$SHARED_CURRENT"
                echo "version_id=$VERSION_ID"
                echo "preview_url=$(jq -r .preview_url "$MARKER_FILE")"
                echo "alias_url=$ALIAS_URL"
                echo "shared_url=$(jq -r .shared_url "$MARKER_FILE")"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "cache_hit=false" >> "$GITHUB_OUTPUT"
        working-directory: template.cfworkers/apps/web
        env:
          APP_ENV: preview
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_IS_DEPLOY: false
          NEXT_PUBLIC_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Ensure preview Worker exists
        if: github.ref_name != 'deploy' && steps.preview-cache.outputs.cache_hit != 'true'
        run: |
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          WORKER_NAME="template-cfworkers-web-preview"
          HTTP_STATUS=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 1 --retry-max-time 30 --output "$RESPONSE_FILE" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$WORKER_NAME")

          case "$HTTP_STATUS" in
            200) ;;
            404)
              HTTP_STATUS=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 1 --retry-max-time 30 --output "$RESPONSE_FILE" --write-out '%{http_code}' \
                --request POST \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                --header "Content-Type: application/json" \
                --data "{\"name\":\"$WORKER_NAME\",\"subdomain\":{\"enabled\":true,\"previews_enabled\":true}}" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers")
              if [[ "$HTTP_STATUS" != "200" ]]; then
                echo "Cloudflare Worker creation failed with HTTP $HTTP_STATUS." >&2
                exit 1
              fi
              ;;
            *)
              echo "Cloudflare Worker lookup failed with HTTP $HTTP_STATUS." >&2
              exit 1
              ;;
          esac
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload preview
        if: github.ref_name != 'deploy' && steps.preview-cache.outputs.cache_hit != 'true'
        id: deploy
        run: |
          set -o pipefail
          pnpm --workspace-root build:worker

          # ponytail: OpenNext 1.20.4's remote helper hangs on this Linux runner.
          # Upload the generated cache through Wrangler until the helper is fixed upstream.
          CACHE_BUCKET="template-cfworkers-preview-next-inc-cache-r2-bucket"
          pnpm exec wrangler d1 execute NEXT_TAG_CACHE_D1 --remote --env preview \
            --command "CREATE TABLE IF NOT EXISTS revalidations (tag TEXT NOT NULL, revalidatedAt INTEGER NOT NULL, stale INTEGER, expire INTEGER default NULL, UNIQUE(tag) ON CONFLICT REPLACE);" &
          D1_PID=$!

          CACHE_UPLOAD_MARKER="/home/runner/_work/.build-cache/r2/${GITHUB_REPOSITORY//\//-}/${WORKER_BUILD_HASH}.complete"

          upload_cache_file() {
            CACHE_FILE=$1
            RELATIVE_PATH=${CACHE_FILE#".open-next/cache/"}
            if [[ "$RELATIVE_PATH" == __fetch/* ]]; then
              RELATIVE_PATH=${RELATIVE_PATH#"__fetch/"}
              BUILD_ID=${RELATIVE_PATH%%/*}
              CACHE_KEY=/${RELATIVE_PATH#*/}
              CACHE_TYPE=fetch
            else
              BUILD_ID=${RELATIVE_PATH%%/*}
              CACHE_KEY=/${RELATIVE_PATH#*/}
              CACHE_KEY=${CACHE_KEY%.cache}
              CACHE_TYPE=cache
            fi
            CACHE_HASH=$(printf '%s' "$CACHE_KEY" | sha256sum | cut -d' ' -f1)
            R2_KEY="incremental-cache/${BUILD_ID}/${CACHE_HASH}.${CACHE_TYPE}"
            pnpm exec wrangler r2 object put "${CACHE_BUCKET}/${R2_KEY}" --remote --file "$CACHE_FILE"
          }
          export -f upload_cache_file
          export CACHE_BUCKET
          if [[ -f "$CACHE_UPLOAD_MARKER" ]]; then
            R2_PID=
          else
            (
              # shellcheck disable=SC2016
              find .open-next/cache -type f -print0 \
                | xargs -0 --no-run-if-empty --max-args=1 --max-procs="$(nproc)" bash -c 'upload_cache_file "$1"' _
              mkdir --parents "$(dirname "$CACHE_UPLOAD_MARKER")"
              touch "$CACHE_UPLOAD_MARKER"
            ) &
            R2_PID=$!
          fi

          OPEN_NEXT_DEPLOY=true pnpm exec wrangler versions upload --env preview --preview-alias "$PREVIEW_ALIAS" 2>&1 | tee deploy-output.log

          wait "$D1_PID"
          if [[ -n "$R2_PID" ]]; then
            wait "$R2_PID"
          fi

          VERSION_ID=$(grep -oP 'Worker Version ID: \K[0-9a-f-]+' deploy-output.log | tail -n 1)
          if [[ -z "$VERSION_ID" ]]; then
            echo "Unable to extract the Worker version ID from the upload output." >&2
            exit 1
          fi
          if [[ -z "${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}" ]]; then
            echo "CLOUDFLARE_WORKERS_DEV_SUBDOMAIN is not configured for the preview environment." >&2
            exit 1
          fi

          OPEN_NEXT_DEPLOY=true pnpm exec wrangler versions deploy "$VERSION_ID@100%" --env preview --yes
          OPEN_NEXT_DEPLOY=true pnpm exec wrangler triggers deploy --env preview

          VERSION_PREFIX=${VERSION_ID%%-*}
          PREVIEW_HOST="template-cfworkers-web-preview.${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}.workers.dev"
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          HTTP_STATUS=$(curl --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 \
            --output "$RESPONSE_FILE" --write-out '%{http_code}' "https://${PREVIEW_HOST}/")
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "Shared preview verification failed with HTTP $HTTP_STATUS." >&2
            exit 1
          fi
          {
            echo "preview_url=https://${VERSION_PREFIX}-${PREVIEW_HOST}"
            echo "alias_url=https://${PREVIEW_ALIAS}-${PREVIEW_HOST}"
            echo "shared_url=https://${PREVIEW_HOST}"
          } >> "$GITHUB_OUTPUT"

          mkdir --parents "$(dirname "$PREVIEW_MARKER_FILE")"
          TEMPORARY_MARKER=$(mktemp "${PREVIEW_MARKER_FILE}.XXXXXX")
          jq --null-input \
            --arg worker_build_hash "$WORKER_BUILD_HASH" \
            --arg version_id "$VERSION_ID" \
            --arg preview_url "https://${VERSION_PREFIX}-${PREVIEW_HOST}" \
            --arg alias_url "https://${PREVIEW_ALIAS}-${PREVIEW_HOST}" \
            --arg shared_url "https://${PREVIEW_HOST}" \
            '{worker_build_hash: $worker_build_hash, version_id: $version_id, preview_url: $preview_url, alias_url: $alias_url, shared_url: $shared_url}' \
            > "$TEMPORARY_MARKER"
          mv "$TEMPORARY_MARKER" "$PREVIEW_MARKER_FILE"
          printf '%s' "$VERSION_ID" > "${SHARED_MARKER_FILE}.tmp"
          mv "${SHARED_MARKER_FILE}.tmp" "$SHARED_MARKER_FILE"
        working-directory: template.cfworkers/apps/web
        env:
          APP_ENV: preview
          NEXT_PUBLIC_IS_DEPLOY: false
          NEXT_PUBLIC_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
          PREVIEW_MARKER_FILE: ${{ steps.preview-cache.outputs.marker_file }}
          SHARED_MARKER_FILE: ${{ steps.preview-cache.outputs.shared_marker_file }}
          WORKER_BUILD_HASH: ${{ steps.preview-cache.outputs.worker_build_hash }}

      - name: Activate cached preview
        if: github.ref_name != 'deploy' && steps.preview-cache.outputs.cache_hit == 'true' && steps.preview-cache.outputs.shared_current != 'true'
        run: |
          OPEN_NEXT_DEPLOY=true pnpm exec wrangler versions deploy "$VERSION_ID@100%" --env preview --yes
          OPEN_NEXT_DEPLOY=true pnpm exec wrangler triggers deploy --env preview
          printf '%s' "$VERSION_ID" > "${SHARED_MARKER_FILE}.tmp"
          mv "${SHARED_MARKER_FILE}.tmp" "$SHARED_MARKER_FILE"
        working-directory: template.cfworkers/apps/web
        env:
          VERSION_ID: ${{ steps.preview-cache.outputs.version_id }}
          SHARED_MARKER_FILE: ${{ steps.preview-cache.outputs.shared_marker_file }}

      - name: Deploy production
        if: github.ref_name == 'deploy'
        run: pnpm run deploy
        working-directory: template.cfworkers/apps/web
        env:
          APP_ENV: production
          NEXT_PUBLIC_IS_DEPLOY: true
          NEXT_PUBLIC_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Display preview URLs
        if: success() && github.ref_name != 'deploy'
        run: |
          {
            echo "## Preview Deployment"
            echo ""
            echo "- **Shared loggable Worker:** $SHARED_URL"
            echo "- **Version Preview URL (isolated, no logs):** $PREVIEW_URL"
            echo "- **Branch Alias URL (isolated, no logs):** $ALIAS_URL"
            echo ""
            echo "Reproduce server errors on the shared Worker, then run:"
            echo ""
            echo '```sh'
            echo "pnpm --dir template.cfworkers/apps/web logs:preview"
            echo '```'
            echo ""
            echo "---"
            echo "_Branch:_ \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SHARED_URL: ${{ steps.preview-cache.outputs.shared_url || steps.deploy.outputs.shared_url }}
          PREVIEW_URL: ${{ steps.preview-cache.outputs.preview_url || steps.deploy.outputs.preview_url }}
          ALIAS_URL: ${{ steps.preview-cache.outputs.alias_url || steps.deploy.outputs.alias_url }}

      - name: Display production deployment
        if: success() && github.ref_name == 'deploy'
        run: |
          {
            echo "## Production Deployment"
            echo ""
            echo "Published \`${{ github.sha }}\` from the \`deploy\` branch."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Turborepo cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: always() && runner.environment != 'self-hosted' && steps.restore-turbo.outputs.cache-hit != 'true'
        with:
          path: template.cfworkers/.turbo
          key: ${{ steps.restore-turbo.outputs.cache-primary-key }}

      - name: Save Next.js cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: runner.environment != 'self-hosted' && steps.restore-next.outputs.cache-hit != 'true'
        with:
          path: template.cfworkers/apps/web/.next/cache
          key: ${{ steps.restore-next.outputs.cache-primary-key }}
