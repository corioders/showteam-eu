# Deploys showteam.cfworkers to Cloudflare Workers.
# Pull requests upload an isolated preview and deploy the latest build to a shared
# Worker with observable logs; the 'deploy' branch publishes production.
#
# Required setup:
# 1. Create a Cloudflare API token at https://dash.cloudflare.com/profile/api-tokens
#    ("Edit Cloudflare Workers" template, or a custom token with:
#     Account - Workers Scripts - Edit, Workers R2 Storage - Edit, D1 - Edit,
#     Zone - Workers Routes - Edit if you use a custom domain).
# 2. Repository Settings > Environments: create 'preview' and 'production'.
#    Add CLOUDFLARE_API_TOKEN as a secret to both.
#    Add CLOUDFLARE_WORKERS_DEV_SUBDOMAIN as a variable to 'preview'.
# 3. Preserve the durable D1/R2 resources named in apps/web/wrangler.jsonc.
#
# Validation and deploy run together on the isolated `win24-wsl` organization runner.
# The source template repository skips this workflow; initialized project
# repositories run it normally.

name: Deploy

on:
  push:
    branches:
      - deploy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository != 'corioders/cstd-nextjs-template'
    runs-on: [self-hosted, win24-wsl]
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'deploy' && 'production' || 'preview' }}
    env:
      DEPLOY_REF: ${{ github.head_ref || github.ref_name }}
      PREVIEW_ALIAS: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
      PNPM_STORE_PATH: ${{ github.workspace }}/../../.pnpm-store
    concurrency:
      group: ${{ github.ref_name == 'deploy' && format('deploy-production-{0}', github.run_id) || 'deploy-shared-preview' }}
      cancel-in-progress: ${{ github.ref_name != 'deploy' }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          clean: false
          sparse-checkout: |
            .github
            showteam.cfworkers

      - name: Setup Node.js
        if: runner.environment != 'self-hosted'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        if: runner.environment != 'self-hosted'
        run: corepack enable

      - name: Restore Turborepo cache
        if: runner.environment != 'self-hosted'
        id: restore-turbo
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: showteam.cfworkers/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Restore Next.js cache
        if: runner.environment != 'self-hosted'
        id: restore-next
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: showteam.cfworkers/apps/web/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('showteam.cfworkers/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('showteam.cfworkers/pnpm-lock.yaml') }}-
            ${{ runner.os }}-${{ runner.arch }}-nextjs-

      - name: Install dependencies
        run: |
          INSTALL_INPUTS_HASH=$(
            {
              git ls-files --stage -- pnpm-lock.yaml pnpm-workspace.yaml .npmrc ':(glob)**/package.json' ':(glob)patches/**'
              node --version
              pnpm --version
            } | sha256sum | cut -d' ' -f1
          )
          INSTALL_MARKER="node_modules/.ci-install-${INSTALL_INPUTS_HASH}"
          if [[ "${{ runner.environment }}" == "self-hosted" && -f "$INSTALL_MARKER" ]]; then
            exit 0
          fi
          pnpm install --frozen-lockfile --prefer-offline --store-dir "$PNPM_STORE_PATH"
          if [[ "${{ runner.environment }}" == "self-hosted" ]]; then
            touch "$INSTALL_MARKER"
          fi
        working-directory: showteam.cfworkers

      - name: Use persistent Next.js cache
        run: |
          CACHE_DIRECTORY="/home/runner/_work/.build-cache/next/${GITHUB_REPOSITORY//\//-}"
          mkdir --parents "$CACHE_DIRECTORY" showteam.cfworkers/apps/web/.next
          ln --symbolic --force --no-dereference "$CACHE_DIRECTORY" showteam.cfworkers/apps/web/.next/cache

      - name: Restore local D1 snapshot
        id: restore-d1
        run: |
          BUILD_INPUTS_HASH=$(
            {
              git ls-files --stage -- \
                showteam.cfworkers/pnpm-lock.yaml \
                showteam.cfworkers/apps/web/migrations \
                showteam.cfworkers/apps/web/payload.config.ts \
                showteam.cfworkers/apps/web/scripts/seed-ci.ts \
                showteam.cfworkers/apps/web/src/collections \
                showteam.cfworkers/apps/web/src/globals \
                'showteam.cfworkers/apps/web/src/lib/seed-*'
              printf '%s' 'E2E_ADMIN_EMAIL=ci-admin@showteam.invalid'
            } | sha256sum | cut -d' ' -f1
          )
          echo "CSTD_BUILD_INPUTS_HASH=$BUILD_INPUTS_HASH" >> "$GITHUB_ENV"
          CACHE_DIRECTORY="/home/runner/_work/.build-cache/showteam-d1/$BUILD_INPUTS_HASH"
          echo "cache-directory=$CACHE_DIRECTORY" >> "$GITHUB_OUTPUT"
          if [[ -f "$CACHE_DIRECTORY/.complete" ]]; then
            mkdir --parents showteam.cfworkers/apps/web/.wrangler
            cp --archive "$CACHE_DIRECTORY/state" showteam.cfworkers/apps/web/.wrangler/state
            echo "cache-hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache-hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Migrate local D1
        if: steps.restore-d1.outputs.cache-hit != 'true'
        run: pnpm migrate:local
        working-directory: showteam.cfworkers/apps/web

      - name: Seed local D1
        if: steps.restore-d1.outputs.cache-hit != 'true'
        run: pnpm seed:local
        working-directory: showteam.cfworkers/apps/web
        env:
          E2E_ADMIN_EMAIL: ci-admin@showteam.invalid
          E2E_ADMIN_PASSWORD: showteam-ci-password-2026

      - name: Save local D1 snapshot
        if: steps.restore-d1.outputs.cache-hit != 'true'
        run: |
          CACHE_DIRECTORY="${{ steps.restore-d1.outputs.cache-directory }}"
          TEMPORARY_DIRECTORY="${CACHE_DIRECTORY}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.tmp"
          mkdir --parents "$TEMPORARY_DIRECTORY"
          cp --archive showteam.cfworkers/apps/web/.wrangler/state "$TEMPORARY_DIRECTORY/state"
          mkdir --parents "$(dirname "$CACHE_DIRECTORY")"
          mv "$TEMPORARY_DIRECTORY" "$CACHE_DIRECTORY"
          touch "$CACHE_DIRECTORY/.complete"

      - name: Validate and build
        run: pnpm validate
        working-directory: showteam.cfworkers
        env:
          PAYLOAD_SECRET: local-ci-secret

      - name: Run browser tests
        run: pnpm --dir apps/web exec playwright test
        working-directory: showteam.cfworkers
        env:
          PAYLOAD_SECRET: local-ci-secret

      - name: Ensure preview Worker exists
        if: github.ref_name != 'deploy'
        run: |
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          WORKER_NAME="showteam-eu-preview"
          HTTP_STATUS=$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$WORKER_NAME")

          case "$HTTP_STATUS" in
            200) ;;
            404)
              HTTP_STATUS=$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out '%{http_code}' \
                --request POST \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                --header "Content-Type: application/json" \
                --data "{\"name\":\"$WORKER_NAME\",\"subdomain\":{\"enabled\":true,\"previews_enabled\":true}}" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers")
              if [[ "$HTTP_STATUS" != "200" ]]; then
                echo "Cloudflare Worker creation failed with HTTP $HTTP_STATUS." >&2
                exit 1
              fi
              ;;
            *)
              echo "Cloudflare Worker lookup failed with HTTP $HTTP_STATUS." >&2
              exit 1
              ;;
          esac
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Check isolated preview D1 snapshot
        if: github.ref_name != 'deploy'
        id: preview-d1
        run: |
          RESULT=$(
            pnpm exec wrangler d1 execute D1 --remote --env preview --json +              --command "CREATE TABLE IF NOT EXISTS _cstd_ci_snapshots (hash TEXT PRIMARY KEY); SELECT COUNT(*) AS matches FROM _cstd_ci_snapshots WHERE hash = '$CSTD_BUILD_INPUTS_HASH';"
          )
          if jq --exit-status '.[-1].results[0].matches == 1' <<<"$RESULT" >/dev/null; then
            echo "cache-hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache-hit=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: showteam.cfworkers/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Migrate isolated preview D1
        if: github.ref_name != 'deploy' && steps.preview-d1.outputs.cache-hit != 'true'
        run: pnpm deploy:database:preview
        working-directory: showteam.cfworkers/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Seed isolated preview D1
        if: github.ref_name != 'deploy' && steps.preview-d1.outputs.cache-hit != 'true'
        run: pnpm seed:preview
        working-directory: showteam.cfworkers/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}

      - name: Mark isolated preview D1 snapshot
        if: github.ref_name != 'deploy' && steps.preview-d1.outputs.cache-hit != 'true'
        run: |
          pnpm exec wrangler d1 execute D1 --remote --env preview +            --command "INSERT OR IGNORE INTO _cstd_ci_snapshots (hash) VALUES ('$CSTD_BUILD_INPUTS_HASH');"
        working-directory: showteam.cfworkers/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Upload preview
        if: github.ref_name != 'deploy'
        id: deploy
        run: |
          set -o pipefail
          pnpm --workspace-root build:worker
          OPEN_NEXT_DEPLOY=true pnpm exec wrangler versions upload --env preview --preview-alias "$PREVIEW_ALIAS" 2>&1 | tee deploy-output.log

          VERSION_ID=$(grep -oP 'Worker Version ID: \K[0-9a-f-]+' deploy-output.log | tail -n 1)
          if [[ -z "$VERSION_ID" ]]; then
            echo "Unable to extract the Worker version ID from the upload output." >&2
            exit 1
          fi
          if [[ -z "${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}" ]]; then
            echo "CLOUDFLARE_WORKERS_DEV_SUBDOMAIN is not configured for the preview environment." >&2
            exit 1
          fi

          OPEN_NEXT_DEPLOY=true pnpm exec wrangler versions deploy "$VERSION_ID@100%" --env preview --yes
          OPEN_NEXT_DEPLOY=true pnpm exec wrangler triggers deploy --env preview

          VERSION_PREFIX=${VERSION_ID%%-*}
          PREVIEW_HOST="showteam-eu-preview.${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}.workers.dev"
          {
            echo "preview_url=https://${VERSION_PREFIX}-${PREVIEW_HOST}"
            echo "alias_url=https://${PREVIEW_ALIAS}-${PREVIEW_HOST}"
            echo "shared_url=https://${PREVIEW_HOST}"
          } >> "$GITHUB_OUTPUT"
        working-directory: showteam.cfworkers/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          APP_ENV: preview
          NEXT_PUBLIC_IS_DEPLOY: false
          NEXT_PUBLIC_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Deploy production
        if: github.ref_name == 'deploy'
        run: pnpm run deploy
        working-directory: showteam.cfworkers/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_ENV: production
          NEXT_PUBLIC_IS_DEPLOY: true
          NEXT_PUBLIC_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}

      - name: Display preview URLs
        if: success() && github.ref_name != 'deploy'
        run: |
          {
            echo "## Preview Deployment"
            echo ""
            echo "- **Shared loggable Worker:** ${{ steps.deploy.outputs.shared_url }}"
            echo "- **Version Preview URL (isolated, no logs):** ${{ steps.deploy.outputs.preview_url }}"
            echo "- **Branch Alias URL (isolated, no logs):** ${{ steps.deploy.outputs.alias_url }}"
            echo ""
            echo "Reproduce server errors on the shared Worker, then run:"
            echo ""
            echo '```sh'
            echo "pnpm --dir showteam.cfworkers/apps/web logs:preview"
            echo '```'
            echo ""
            echo "---"
            echo "_Branch:_ \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Display production deployment
        if: success() && github.ref_name == 'deploy'
        run: |
          {
            echo "## Production Deployment"
            echo ""
            echo "Published \`${{ github.sha }}\` from the \`deploy\` branch."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save Turborepo cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: always() && runner.environment != 'self-hosted' && steps.restore-turbo.outputs.cache-hit != 'true'
        with:
          path: showteam.cfworkers/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}

      - name: Save Next.js cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: runner.environment != 'self-hosted' && steps.restore-next.outputs.cache-hit != 'true'
        with:
          path: showteam.cfworkers/apps/web/.next/cache
          key: ${{ steps.restore-next.outputs.cache-primary-key }}
