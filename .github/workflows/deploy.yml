# Deploys showteam.cfworkers to Cloudflare Workers.
# The 'deploy' branch publishes production; every other branch uploads an isolated
# preview version and deploys the latest build to a shared Worker with observable logs.
#
# Required setup:
# 1. Create a Cloudflare API token at https://dash.cloudflare.com/profile/api-tokens
#    ("Edit Cloudflare Workers" template, or a custom token with:
#     Account - Workers Scripts - Edit, Workers R2 Storage - Edit, D1 - Edit,
#     Zone - Workers Routes - Edit if you use a custom domain).
# 2. Repository Settings > Environments: create 'preview' and 'production'.
#    Add CLOUDFLARE_API_TOKEN as a secret to both.
#    Add CLOUDFLARE_WORKERS_DEV_SUBDOMAIN as a variable to 'preview'.
# 3. Preserve the durable D1/R2 resources named in apps/web/wrangler.jsonc.
#
# Trusted validation and deploy jobs run on the isolated `win24-wsl` organization runner.
# Fork pull requests stay on Blacksmith because their code is untrusted.
# The source template repository skips this workflow; initialized project
# repositories run it normally.

name: Deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    if: github.repository != 'corioders/cstd-nextjs-template'
    needs: validate
    runs-on: [self-hosted, win24-wsl]
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'deploy' && 'production' || 'preview' }}
    concurrency:
      group: ${{ github.ref_name == 'deploy' && format('deploy-production-{0}', github.run_id) || 'deploy-shared-preview' }}
      cancel-in-progress: ${{ github.ref_name != 'deploy' }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            showteam.cfworkers

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        working-directory: showteam.cfworkers
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm cache
        id: restore-pnpm
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Restore Turborepo cache
        id: restore-turbo
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: showteam.cfworkers/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Restore Next.js cache
        id: restore-next
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: showteam.cfworkers/apps/web/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('showteam.cfworkers/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('showteam.cfworkers/pnpm-lock.yaml') }}-
            ${{ runner.os }}-${{ runner.arch }}-nextjs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: showteam.cfworkers

      - name: Ensure preview Worker exists
        if: github.ref_name != 'deploy'
        run: |
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          WORKER_NAME="showteam-eu-preview"
          HTTP_STATUS=$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$WORKER_NAME")

          case "$HTTP_STATUS" in
            200) ;;
            404)
              HTTP_STATUS=$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out '%{http_code}' \
                --request POST \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                --header "Content-Type: application/json" \
                --data "{\"name\":\"$WORKER_NAME\",\"subdomain\":{\"enabled\":true,\"previews_enabled\":true}}" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers")
              if [[ "$HTTP_STATUS" != "200" ]]; then
                echo "Cloudflare Worker creation failed with HTTP $HTTP_STATUS." >&2
                exit 1
              fi
              ;;
            *)
              echo "Cloudflare Worker lookup failed with HTTP $HTTP_STATUS." >&2
              exit 1
              ;;
          esac
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Migrate isolated preview D1
        if: github.ref_name != 'deploy'
        run: pnpm deploy:database:preview
        working-directory: showteam.cfworkers/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Seed isolated preview D1
        if: github.ref_name != 'deploy'
        run: pnpm seed:preview
        working-directory: showteam.cfworkers/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}

      - name: Upload preview
        if: github.ref_name != 'deploy'
        id: deploy
        run: |
          set -o pipefail
          pnpm exec opennextjs-cloudflare build
          OPEN_NEXT_DEPLOY=true pnpm exec wrangler versions upload --env preview --preview-alias "${{ github.ref_name }}" 2>&1 | tee deploy-output.log

          VERSION_ID=$(grep -oP 'Worker Version ID: \K[0-9a-f-]+' deploy-output.log | tail -n 1)
          if [[ -z "$VERSION_ID" ]]; then
            echo "Unable to extract the Worker version ID from the upload output." >&2
            exit 1
          fi
          if [[ -z "${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}" ]]; then
            echo "CLOUDFLARE_WORKERS_DEV_SUBDOMAIN is not configured for the preview environment." >&2
            exit 1
          fi

          OPEN_NEXT_DEPLOY=true pnpm exec wrangler versions deploy "$VERSION_ID@100%" --env preview --yes
          OPEN_NEXT_DEPLOY=true pnpm exec wrangler triggers deploy --env preview

          VERSION_PREFIX=${VERSION_ID%%-*}
          PREVIEW_HOST="showteam-eu-preview.${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}.workers.dev"
          {
            echo "preview_url=https://${VERSION_PREFIX}-${PREVIEW_HOST}"
            echo "alias_url=https://${{ github.ref_name }}-${PREVIEW_HOST}"
            echo "shared_url=https://${PREVIEW_HOST}"
          } >> "$GITHUB_OUTPUT"
        working-directory: showteam.cfworkers/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          APP_ENV: preview
          RANDOM_VALUE_TO_ENSURE_APPS_WEB_IS_REBUILD_ON_GH_ACTIONS: ${{ github.run_id }}
          NEXT_PUBLIC_IS_DEPLOY: false
          NEXT_PUBLIC_GIT_BRANCH: ${{ github.ref_name }}

      - name: Deploy production
        if: github.ref_name == 'deploy'
        run: pnpm run deploy
        working-directory: showteam.cfworkers/apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_ENV: production
          RANDOM_VALUE_TO_ENSURE_APPS_WEB_IS_REBUILD_ON_GH_ACTIONS: ${{ github.run_id }}
          NEXT_PUBLIC_IS_DEPLOY: true
          NEXT_PUBLIC_GIT_BRANCH: ${{ github.ref_name }}

      - name: Display preview URLs
        if: success() && github.ref_name != 'deploy'
        run: |
          {
            echo "## Preview Deployment"
            echo ""
            echo "- **Shared loggable Worker:** ${{ steps.deploy.outputs.shared_url }}"
            echo "- **Version Preview URL (isolated, no logs):** ${{ steps.deploy.outputs.preview_url }}"
            echo "- **Branch Alias URL (isolated, no logs):** ${{ steps.deploy.outputs.alias_url }}"
            echo ""
            echo "Reproduce server errors on the shared Worker, then run:"
            echo ""
            echo '```sh'
            echo "pnpm --dir showteam.cfworkers/apps/web logs:preview"
            echo '```'
            echo ""
            echo "---"
            echo "_Branch:_ \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Display production deployment
        if: success() && github.ref_name == 'deploy'
        run: |
          {
            echo "## Production Deployment"
            echo ""
            echo "Published \`${{ github.sha }}\` from the \`deploy\` branch."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save pnpm cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: always() && steps.restore-pnpm.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Save Turborepo cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: always() && steps.restore-turbo.outputs.cache-hit != 'true'
        with:
          path: showteam.cfworkers/.turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}

      - name: Save Next.js cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.restore-next.outputs.cache-hit != 'true'
        with:
          path: showteam.cfworkers/apps/web/.next/cache
          key: ${{ steps.restore-next.outputs.cache-primary-key }}
