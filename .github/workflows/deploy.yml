# Common implementation is versioned beside this caller and distributed by pull_template.sh.
name: Deploy

on:
  push:
    branches:
      - main
      - payload
      - deploy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schedule:
    uses: ./.github/workflows/_schedule-runner.yml

  application:
    needs: schedule
    uses: ./.github/workflows/_deploy.yml
    with:
      runner-label: ${{ needs.schedule.outputs.runner-label }}
      app-directory: template.cfworkers
      worker-name: template-cfworkers
      preview-worker-name: template-cfworkers-preview
      production-cache-bucket: template-cfworkers-next-inc-cache-r2-bucket
      preview-cache-bucket: template-cfworkers-preview-next-inc-cache-r2-bucket
      deploy-enabled: ${{ github.repository != 'corioders/cstd-nextjs-template' }}
      payload: true
    secrets: inherit
