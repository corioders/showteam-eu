# Common implementation is versioned beside this caller and distributed by pull_template.sh.
name: Deploy

on:
  push:
    branches:
      - main
      - payload
      - deploy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schedule:
    uses: ./.github/workflows/_schedule-runner.yml

  application:
    needs: schedule
    uses: ./.github/workflows/_deploy.yml
    with:
      runner-label: ${{ needs.schedule.outputs.runner-label }}
      app-directory: showteam.cfworkers
      worker-name: showteam-eu
      preview-worker-name: showteam-eu-preview
      production-cache-bucket: showteam-next-cache
      preview-cache-bucket: showteam-preview-next-cache
      deploy-enabled: ${{ github.repository != 'corioders/cstd-nextjs-template' }}
      payload: true
      payload-d1-binding: D1
      payload-local-migrate-command: pnpm migrate:local
      payload-local-seed-command: pnpm seed:local
      payload-preview-migrate-command: pnpm deploy:database:preview
      payload-preview-seed-command: pnpm seed:preview
      payload-production-migrate-command: pnpm deploy:database
      payload-seed-production: false
      e2e-admin-email: ci-admin@showteam.invalid
      e2e-admin-password: showteam-ci-password-2026
    secrets: inherit
