name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showteam-ci
  cancel-in-progress: false

jobs:
  validate:
    runs-on: [self-hosted, macOS, X64, macbook-pro-2015, nix, showteam]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
