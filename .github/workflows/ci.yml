name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showteam-ci
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, macbook15]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:unit
      - name: Prepare local D1 schema
        run: |
          rm -rf .wrangler/state
          pnpm payload migrate
      - name: Seed CMS fixtures
        run: pnpm payload run scripts/seed-ci.ts
        env:
          NODE_ENV: production
          PAYLOAD_SECRET: showteam-ci-only-secret-not-used-in-production
          SEED_CMS: "true"
          E2E_ADMIN_EMAIL: e2e-admin@showteam.invalid
          E2E_ADMIN_PASSWORD: showteam-e2e-password-2026
      - name: Build from a clean Next.js cache
        run: |
          rm -rf .next
          pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Run WebKit E2E on a fresh server
        run: pnpm exec playwright test --project=webkit
        env:
          PAYLOAD_SECRET: showteam-ci-only-secret-not-used-in-production
          E2E_ADMIN_EMAIL: e2e-admin@showteam.invalid
          E2E_ADMIN_PASSWORD: showteam-e2e-password-2026
      - name: Run Chromium E2E on a fresh server
        run: pnpm exec playwright test --project=chromium
        env:
          PAYLOAD_SECRET: showteam-ci-only-secret-not-used-in-production
          E2E_ADMIN_EMAIL: e2e-admin@showteam.invalid
          E2E_ADMIN_PASSWORD: showteam-e2e-password-2026
