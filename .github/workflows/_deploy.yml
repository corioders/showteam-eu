name: Deploy application

on:
  workflow_call:
    inputs:
      runner-label:
        description: Label reserved by the shared scheduler.
        required: true
        type: string
      app-directory:
        description: Workspace directory containing pnpm-workspace.yaml.
        required: true
        type: string
      worker-name:
        description: Production Cloudflare Worker name.
        required: true
        type: string
      preview-worker-name:
        description: Preview Cloudflare Worker name.
        required: true
        type: string
      production-cache-bucket:
        description: Production OpenNext incremental-cache R2 bucket.
        required: true
        type: string
      preview-cache-bucket:
        description: Preview OpenNext incremental-cache R2 bucket.
        required: true
        type: string
      deploy-enabled:
        description: Fetch secrets and deploy after validation.
        default: true
        type: boolean
      payload:
        description: Enable the standard Payload D1 lifecycle.
        default: false
        type: boolean
      payload-d1-binding:
        description: Wrangler D1 binding used by Payload.
        default: PAYLOAD_DB
        type: string
      payload-seed-production:
        description: Seed the Payload administrator after production migration.
        default: true
        type: boolean
      payload-local-migrate-command:
        description: Command that migrates local Payload D1.
        default: pnpm payload:migrate:local
        type: string
      payload-local-seed-command:
        description: Command that seeds local Payload D1.
        default: pnpm payload:seed:local
        type: string
      payload-preview-migrate-command:
        description: Command that migrates preview Payload D1.
        default: pnpm payload:migrate:preview
        type: string
      payload-preview-seed-command:
        description: Command that seeds preview Payload D1.
        default: pnpm payload:seed:preview
        type: string
      payload-production-migrate-command:
        description: Command that migrates production Payload D1.
        default: pnpm payload:migrate:production
        type: string
      payload-production-seed-command:
        description: Command that seeds production Payload D1.
        default: pnpm payload:seed:production
        type: string
      telemetry-d1-binding:
        description: Optional telemetry D1 binding whose migrations run before deploy.
        default: ""
        type: string
      runtime-secret-names:
        description: Space-separated Infisical variables uploaded as encrypted Worker runtime secrets.
        default: ""
        type: string
      production-health-url:
        description: Optional URL checked after a production deploy.
        default: ""
        type: string
      production-custom-domain:
        description: Optional custom domain attached to the production Worker through the Workers Domains API.
        default: ""
        type: string
      install-playwright:
        description: Install Chromium and WebKit before validation.
        default: false
        type: boolean
      e2e-admin-email:
        description: Optional local Payload fixture administrator email.
        default: ""
        type: string
      e2e-admin-password:
        description: Optional local Payload fixture administrator password.
        default: ""
        type: string
      payload-local-admin-username:
        description: Local Payload administrator username used by validation.
        default: core users
        type: string
      payload-local-admin-password:
        description: Local Payload administrator password used by validation.
        default: admin
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: [self-hosted, "${{ inputs.runner-label }}"]
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'deploy' && 'production' || 'preview' }}
    env:
      APP_DIRECTORY: ${{ inputs.app-directory }}
      APP_ENV: ${{ github.ref_name == 'deploy' && 'production' || 'preview' }}
      DEPLOY_REF: ${{ github.head_ref || github.ref_name }}
      NEXT_PUBLIC_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      NEXT_PUBLIC_IS_DEPLOY: ${{ github.ref_name == 'deploy' }}
      PREVIEW_ALIAS: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
      PNPM_STORE_PATH: ${{ github.workspace }}/../../.pnpm-store
      PREVIEW_WORKER_NAME: ${{ inputs.preview-worker-name }}
      WORKER_NAME: ${{ inputs.worker-name }}
      PRODUCTION_CACHE_BUCKET: ${{ inputs.production-cache-bucket }}
      PREVIEW_CACHE_BUCKET: ${{ inputs.preview-cache-bucket }}
    concurrency:
      group: ${{ github.ref_name == 'deploy' && format('deploy-production-{0}', github.run_id) || format('deploy-preview-{0}', github.ref) }}
      cancel-in-progress: ${{ github.ref_name != 'deploy' }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          clean: false
          sparse-checkout: |
            .github
            ${{ inputs.app-directory }}

      - name: Normalize preview alias
        if: github.ref_name != 'deploy'
        run: |
          SAFE_PREVIEW_ALIAS=$(printf '%s' "$PREVIEW_ALIAS" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//' | cut -c1-63 | sed -E 's/-+$//')
          if [[ -z "$SAFE_PREVIEW_ALIAS" ]]; then
            echo "The Git ref does not produce a valid preview alias." >&2
            exit 1
          fi
          echo "PREVIEW_ALIAS=$SAFE_PREVIEW_ALIAS" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          INSTALL_INPUTS_HASH=$(
            {
              git ls-files --stage -- pnpm-lock.yaml pnpm-workspace.yaml .npmrc ':(glob)**/package.json' ':(glob)patches/**'
              node --version
              pnpm --version
            } | sha256sum | cut -d' ' -f1
          )
          INSTALL_MARKER="node_modules/.ci-install-$INSTALL_INPUTS_HASH"
          if [[ -f "$INSTALL_MARKER" ]]; then
            exit 0
          fi
          pnpm install --frozen-lockfile --prefer-offline --store-dir "$PNPM_STORE_PATH"
          touch "$INSTALL_MARKER"
        working-directory: ${{ inputs.app-directory }}

      - name: Install Playwright browsers
        if: inputs.install-playwright
        run: |
          PLAYWRIGHT_CACHE="$RUNNER_TEMP/ms-playwright"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_CACHE" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_CACHE" pnpm --dir apps/web exec playwright install chromium webkit
        working-directory: ${{ inputs.app-directory }}

      - name: Use persistent Next.js cache
        run: |
          CACHE_DIRECTORY="/home/runner/_work/.build-cache/next/${GITHUB_REPOSITORY//\//-}"
          mkdir --parents "$CACHE_DIRECTORY" "$APP_DIRECTORY/apps/web/.next"
          ln --symbolic --force --no-dereference "$CACHE_DIRECTORY" "$APP_DIRECTORY/apps/web/.next/cache"

      - name: Use persistent Turborepo cache
        run: |
          CACHE_DIRECTORY="/home/runner/_work/.build-cache/turbo/${GITHUB_REPOSITORY//\//-}"
          mkdir --parents "$CACHE_DIRECTORY"
          ln --symbolic --force --no-dereference "$CACHE_DIRECTORY" "$APP_DIRECTORY/.turbo"

      - name: Fetch deployment secrets from Infisical
        if: inputs.deploy-enabled
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ github.event.repository.name }}
          env-slug: ${{ github.ref_name == 'deploy' && 'prod' || 'staging' }}
          domain: ${{ vars.INFISICAL_DOMAIN }}

      - name: Ensure deployment Worker exists
        if: inputs.deploy-enabled
        run: |
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          HTTP_STATUS=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 1 --retry-max-time 30 --output "$RESPONSE_FILE" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$DEPLOYMENT_WORKER_NAME")
          case "$HTTP_STATUS" in
            200) ;;
            404)
              HTTP_STATUS=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 1 --retry-max-time 30 --output "$RESPONSE_FILE" --write-out '%{http_code}' --request POST --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header "Content-Type: application/json" --data "{\"name\":\"$DEPLOYMENT_WORKER_NAME\",\"subdomain\":{\"enabled\":true,\"previews_enabled\":true}}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers")
              [[ "$HTTP_STATUS" == "200" ]] || {
                echo "Cloudflare Worker creation failed with HTTP $HTTP_STATUS." >&2
                exit 1
              }
              ;;
            *)
              echo "Cloudflare Worker lookup failed with HTTP $HTTP_STATUS." >&2
              exit 1
              ;;
          esac

          HTTP_STATUS=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 1 --retry-max-time 30 --output "$RESPONSE_FILE" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$DEPLOYMENT_WORKER_NAME/settings")
          case "$HTTP_STATUS" in
            200) ;;
            404)
              BOOTSTRAP_DIRECTORY=$(mktemp -d)
              trap 'rm -f "$RESPONSE_FILE"; rm -rf "$BOOTSTRAP_DIRECTORY"' EXIT
              printf '%s\n' 'export default { fetch() { return new Response("Deployment pending.", { status: 503 }); } };' > "$BOOTSTRAP_DIRECTORY/worker.mjs"
              printf '%s\n' '{' "  \"name\": \"$DEPLOYMENT_WORKER_NAME\"," '  "main": "worker.mjs",' '  "compatibility_date": "2026-09-06"' '}' > "$BOOTSTRAP_DIRECTORY/wrangler.jsonc"
              pnpm exec wrangler deploy --config "$BOOTSTRAP_DIRECTORY/wrangler.jsonc"
              ;;
            *)
              echo "Cloudflare Worker settings lookup failed with HTTP $HTTP_STATUS." >&2
              exit 1
              ;;
          esac
        working-directory: ${{ inputs.app-directory }}/apps/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYMENT_WORKER_NAME: ${{ github.ref_name == 'deploy' && inputs.worker-name || inputs.preview-worker-name }}

      - name: Resolve external build inputs
        run: pnpm resolve-build-inputs
        working-directory: ${{ inputs.app-directory }}

      - name: Prepare runtime secrets
        if: inputs.deploy-enabled && inputs.runtime-secret-names != ''
        run: |
          RUNTIME_SECRETS_FILE="$RUNNER_TEMP/runtime-secrets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          printf '{}' > "$RUNTIME_SECRETS_FILE"
          for SECRET_NAME in $RUNTIME_SECRET_NAMES; do
            if [[ ! "$SECRET_NAME" =~ ^[A-Z_][A-Z0-9_]*$ ]]; then
              echo "Invalid runtime secret name: $SECRET_NAME" >&2
              exit 1
            fi
            SECRET_VALUE=${!SECRET_NAME:-}
            if [[ -z "$SECRET_VALUE" ]]; then
              echo "Required runtime secret is missing: $SECRET_NAME" >&2
              exit 1
            fi
            UPDATED_SECRETS_FILE="${RUNTIME_SECRETS_FILE}.tmp"
            jq --arg name "$SECRET_NAME" --arg value "$SECRET_VALUE" '. + {($name): $value}' "$RUNTIME_SECRETS_FILE" > "$UPDATED_SECRETS_FILE"
            mv "$UPDATED_SECRETS_FILE" "$RUNTIME_SECRETS_FILE"
          done
          echo "RUNTIME_SECRETS_FILE=$RUNTIME_SECRETS_FILE" >> "$GITHUB_ENV"
        env:
          RUNTIME_SECRET_NAMES: ${{ inputs.runtime-secret-names }}

      - name: Restore local Payload D1 snapshot
        if: inputs.payload
        id: restore-payload-d1
        run: |
          BUILD_INPUTS_HASH=$(
            {
              git ls-files --stage -- "$APP_DIRECTORY/pnpm-lock.yaml" "$APP_DIRECTORY/apps/web/migrations" "$APP_DIRECTORY/apps/web/payload.config.ts" "$APP_DIRECTORY/apps/web/scripts" "$APP_DIRECTORY/apps/web/src/collections" "$APP_DIRECTORY/apps/web/src/globals"
              printf '%s' "E2E_ADMIN_EMAIL=${{ inputs.e2e-admin-email }}"
              printf '%s' "PAYLOAD_ADMIN_USERNAME=${{ inputs.payload-local-admin-username }}"
              printf '%s' "PAYLOAD_ADMIN_PASSWORD=${{ inputs.payload-local-admin-password }}"
            } | sha256sum | cut -d' ' -f1
          )
          echo "CSTD_BUILD_INPUTS_HASH=$BUILD_INPUTS_HASH" >> "$GITHUB_ENV"
          CACHE_DIRECTORY="/home/runner/_work/.build-cache/payload-d1/${GITHUB_REPOSITORY//\//-}/$BUILD_INPUTS_HASH"
          echo "cache-directory=$CACHE_DIRECTORY" >> "$GITHUB_OUTPUT"
          if [[ -f "$CACHE_DIRECTORY/.complete" ]]; then
            rm -rf "$APP_DIRECTORY/apps/web/.wrangler/state"
            mkdir --parents "$APP_DIRECTORY/apps/web/.wrangler"
            cp --archive "$CACHE_DIRECTORY/state" "$APP_DIRECTORY/apps/web/.wrangler/state"
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Migrate local Payload D1
        if: inputs.payload && steps.restore-payload-d1.outputs.cache_hit != 'true'
        run: ${{ inputs.payload-local-migrate-command }}
        working-directory: ${{ inputs.app-directory }}/apps/web

      - name: Seed local Payload D1
        if: inputs.payload && steps.restore-payload-d1.outputs.cache_hit != 'true'
        run: ${{ inputs.payload-local-seed-command }}
        working-directory: ${{ inputs.app-directory }}/apps/web
        env:
          E2E_ADMIN_EMAIL: ${{ inputs.e2e-admin-email }}
          E2E_ADMIN_PASSWORD: ${{ inputs.e2e-admin-password }}
          PAYLOAD_ADMIN_USERNAME: ${{ inputs.payload-local-admin-username }}
          PAYLOAD_ADMIN_PASSWORD: ${{ inputs.payload-local-admin-password }}

      - name: Save local Payload D1 snapshot
        if: inputs.payload && steps.restore-payload-d1.outputs.cache_hit != 'true'
        run: |
          CACHE_DIRECTORY="${{ steps.restore-payload-d1.outputs.cache-directory }}"
          TEMPORARY_DIRECTORY="${CACHE_DIRECTORY}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.tmp"
          mkdir --parents "$TEMPORARY_DIRECTORY"
          cp --archive "$APP_DIRECTORY/apps/web/.wrangler/state" "$TEMPORARY_DIRECTORY/state"
          mkdir --parents "$(dirname "$CACHE_DIRECTORY")"
          mv "$TEMPORARY_DIRECTORY" "$CACHE_DIRECTORY"
          touch "$CACHE_DIRECTORY/.complete"

      - name: Validate, build, and run browser tests
        run: CSTD_D1_PERSIST_PATH=".wrangler/state/v3" pnpm validate:ci
        working-directory: ${{ inputs.app-directory }}
        env:
          PAYLOAD_ADMIN_USERNAME: ${{ inputs.payload-local-admin-username }}
          PAYLOAD_ADMIN_PASSWORD: ${{ inputs.payload-local-admin-password }}

      - name: Apply telemetry database migrations
        if: inputs.deploy-enabled && inputs.telemetry-d1-binding != ''
        run: |
          if [[ "$APP_ENV" == "production" ]]; then
            pnpm exec wrangler d1 migrations apply "$TELEMETRY_D1_BINDING" --remote
          else
            pnpm exec wrangler d1 migrations apply "$TELEMETRY_D1_BINDING" --env preview --remote
          fi
        working-directory: ${{ inputs.app-directory }}/apps/web
        env:
          TELEMETRY_D1_BINDING: ${{ inputs.telemetry-d1-binding }}

      - name: Check deployed preview
        if: inputs.deploy-enabled && github.ref_name != 'deploy'
        id: preview-cache
        run: |
          WORKER_BUILD_HASH=$(pnpm --workspace-root turbo run build:worker --filter=web --dry=json 2>/dev/null | jq --exit-status --raw-output '.tasks[] | select(.task == "build:worker") | .hash')
          MARKER_DIRECTORY="/home/runner/_work/.build-cache/deploy/${GITHUB_REPOSITORY//\//-}/$PREVIEW_ALIAS"
          MARKER_FILE="$MARKER_DIRECTORY/current.json"
          SHARED_MARKER_FILE="${MARKER_DIRECTORY%/*}/shared-current-version"
          {
            echo "worker_build_hash=$WORKER_BUILD_HASH"
            echo "marker_file=$MARKER_FILE"
            echo "shared_marker_file=$SHARED_MARKER_FILE"
          } >> "$GITHUB_OUTPUT"

          if [[ -f "$MARKER_FILE" ]] && jq --exit-status --arg hash "$WORKER_BUILD_HASH" '.worker_build_hash == $hash and (.version_id | length > 0)' "$MARKER_FILE" >/dev/null
          then
            VERSION_ID=$(jq -r .version_id "$MARKER_FILE")
            HTTP_STATUS=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 1 --retry-max-time 30 --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PREVIEW_WORKER_NAME/versions/$VERSION_ID" || true)
            if [[ "$HTTP_STATUS" == "200" ]]; then
              SHARED_CURRENT=false
              if [[ -f "$SHARED_MARKER_FILE" && "$(<"$SHARED_MARKER_FILE")" == "$VERSION_ID" ]]; then
                SHARED_CURRENT=true
              fi
              {
                echo "cache_hit=true"
                echo "shared_current=$SHARED_CURRENT"
                echo "version_id=$VERSION_ID"
                echo "preview_url=$(jq -r .preview_url "$MARKER_FILE")"
                echo "alias_url=$(jq -r .alias_url "$MARKER_FILE")"
                echo "shared_url=$(jq -r .shared_url "$MARKER_FILE")"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "cache_hit=false" >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.app-directory }}/apps/web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check preview Payload D1 snapshot
        if: inputs.deploy-enabled && inputs.payload && github.ref_name != 'deploy' && steps.preview-cache.outputs.cache_hit != 'true'
        id: preview-payload-d1
        run: |
          RESULT=$(
            pnpm exec wrangler d1 execute "$PAYLOAD_D1_BINDING" --remote --env preview --json --command "CREATE TABLE IF NOT EXISTS _cstd_ci_snapshots (hash TEXT PRIMARY KEY); SELECT COUNT(*) AS matches FROM _cstd_ci_snapshots WHERE hash = '$CSTD_BUILD_INPUTS_HASH';"
          )
          if jq --exit-status '.[-1].results[0].matches == 1' <<<"$RESULT" >/dev/null; then
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: ${{ inputs.app-directory }}/apps/web
        env:
          PAYLOAD_D1_BINDING: ${{ inputs.payload-d1-binding }}

      - name: Migrate preview Payload D1
        if: inputs.deploy-enabled && inputs.payload && github.ref_name != 'deploy' && steps.preview-cache.outputs.cache_hit != 'true' && steps.preview-payload-d1.outputs.cache_hit != 'true'
        run: ${{ inputs.payload-preview-migrate-command }}
        working-directory: ${{ inputs.app-directory }}/apps/web

      - name: Seed preview Payload D1
        if: inputs.deploy-enabled && inputs.payload && github.ref_name != 'deploy' && steps.preview-cache.outputs.cache_hit != 'true' && steps.preview-payload-d1.outputs.cache_hit != 'true'
        run: ${{ inputs.payload-preview-seed-command }}
        working-directory: ${{ inputs.app-directory }}/apps/web

      - name: Mark preview Payload D1 snapshot
        if: inputs.deploy-enabled && inputs.payload && github.ref_name != 'deploy' && steps.preview-cache.outputs.cache_hit != 'true' && steps.preview-payload-d1.outputs.cache_hit != 'true'
        run: pnpm exec wrangler d1 execute "$PAYLOAD_D1_BINDING" --remote --env preview --command "INSERT OR IGNORE INTO _cstd_ci_snapshots (hash) VALUES ('$CSTD_BUILD_INPUTS_HASH');"
        working-directory: ${{ inputs.app-directory }}/apps/web
        env:
          PAYLOAD_D1_BINDING: ${{ inputs.payload-d1-binding }}

      - name: Upload preview
        if: inputs.deploy-enabled && github.ref_name != 'deploy' && steps.preview-cache.outputs.cache_hit != 'true'
        id: deploy
        run: |
          set -o pipefail
          pnpm exec wrangler d1 execute NEXT_TAG_CACHE_D1 --remote --env preview --command "CREATE TABLE IF NOT EXISTS revalidations (tag TEXT NOT NULL, revalidatedAt INTEGER NOT NULL, stale INTEGER, expire INTEGER default NULL, UNIQUE(tag) ON CONFLICT REPLACE);" &
          D1_PID=$!

          CACHE_UPLOAD_MARKER="/home/runner/_work/.build-cache/r2/${GITHUB_REPOSITORY//\//-}/$WORKER_BUILD_HASH.complete"
          upload_cache_file() {
            CACHE_FILE=$1
            RELATIVE_PATH=${CACHE_FILE#".open-next/cache/"}
            if [[ "$RELATIVE_PATH" == __fetch/* ]]; then
              RELATIVE_PATH=${RELATIVE_PATH#"__fetch/"}
              BUILD_ID=${RELATIVE_PATH%%/*}
              CACHE_KEY=/${RELATIVE_PATH#*/}
              CACHE_TYPE=fetch
            else
              BUILD_ID=${RELATIVE_PATH%%/*}
              CACHE_KEY=/${RELATIVE_PATH#*/}
              CACHE_KEY=${CACHE_KEY%.cache}
              CACHE_TYPE=cache
            fi
            CACHE_HASH=$(printf '%s' "$CACHE_KEY" | sha256sum | cut -d' ' -f1)
            R2_KEY="incremental-cache/$BUILD_ID/$CACHE_HASH.$CACHE_TYPE"
            pnpm exec wrangler r2 object put "$PREVIEW_CACHE_BUCKET/$R2_KEY" --remote --file "$CACHE_FILE"
          }
          export -f upload_cache_file
          export PREVIEW_CACHE_BUCKET
          if [[ -f "$CACHE_UPLOAD_MARKER" ]]; then
            R2_PID=
          else
            (
              # shellcheck disable=SC2016
              find .open-next/cache -type f -print0 | xargs -0 --no-run-if-empty --max-args=1 --max-procs="$(nproc)" bash -c 'upload_cache_file "$1"' _
              mkdir --parents "$(dirname "$CACHE_UPLOAD_MARKER")"
              touch "$CACHE_UPLOAD_MARKER"
            ) &
            R2_PID=$!
          fi

          SECRETS_ARGUMENTS=()
          if [[ -n "${RUNTIME_SECRETS_FILE:-}" ]]; then
            SECRETS_ARGUMENTS=(--secrets-file "$RUNTIME_SECRETS_FILE")
          fi
          OPEN_NEXT_DEPLOY=true pnpm exec wrangler versions upload --env preview --preview-alias "$PREVIEW_ALIAS" "${SECRETS_ARGUMENTS[@]}" 2>&1 | tee deploy-output.log
          wait "$D1_PID"
          if [[ -n "$R2_PID" ]]; then
            wait "$R2_PID"
          fi

          VERSION_ID=$(grep -oP 'Worker Version ID: \K[0-9a-f-]+' deploy-output.log | tail -n 1)
          if [[ -z "$VERSION_ID" ]]; then
            echo "Unable to extract the Worker version ID from the upload output." >&2
            exit 1
          fi
          if [[ -z "${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}" ]]; then
            echo "CLOUDFLARE_WORKERS_DEV_SUBDOMAIN is not configured for the preview environment." >&2
            exit 1
          fi

          OPEN_NEXT_DEPLOY=true pnpm exec wrangler versions deploy "$VERSION_ID@100%" --env preview --yes
          OPEN_NEXT_DEPLOY=true pnpm exec wrangler triggers deploy --env preview

          VERSION_PREFIX=${VERSION_ID%%-*}
          PREVIEW_HOST="$PREVIEW_WORKER_NAME.${{ vars.CLOUDFLARE_WORKERS_DEV_SUBDOMAIN }}.workers.dev"
          HTTP_STATUS=$(curl --silent --show-error --location --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 --output /dev/null --write-out '%{http_code}' "https://$PREVIEW_HOST/")
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "Shared preview verification failed with HTTP $HTTP_STATUS." >&2
            exit 1
          fi

          mkdir --parents "$(dirname "$PREVIEW_MARKER_FILE")"
          TEMPORARY_MARKER=$(mktemp "${PREVIEW_MARKER_FILE}.XXXXXX")
          jq --null-input --arg worker_build_hash "$WORKER_BUILD_HASH" --arg version_id "$VERSION_ID" --arg preview_url "https://$VERSION_PREFIX-$PREVIEW_HOST" --arg alias_url "https://$PREVIEW_ALIAS-$PREVIEW_HOST" --arg shared_url "https://$PREVIEW_HOST" '{worker_build_hash: $worker_build_hash, version_id: $version_id, preview_url: $preview_url, alias_url: $alias_url, shared_url: $shared_url}' > "$TEMPORARY_MARKER"
          mv "$TEMPORARY_MARKER" "$PREVIEW_MARKER_FILE"
          printf '%s' "$VERSION_ID" > "${SHARED_MARKER_FILE}.tmp"
          mv "${SHARED_MARKER_FILE}.tmp" "$SHARED_MARKER_FILE"
          {
            echo "preview_url=https://$VERSION_PREFIX-$PREVIEW_HOST"
            echo "alias_url=https://$PREVIEW_ALIAS-$PREVIEW_HOST"
            echo "shared_url=https://$PREVIEW_HOST"
          } >> "$GITHUB_OUTPUT"
        working-directory: ${{ inputs.app-directory }}/apps/web
        env:
          PREVIEW_MARKER_FILE: ${{ steps.preview-cache.outputs.marker_file }}
          SHARED_MARKER_FILE: ${{ steps.preview-cache.outputs.shared_marker_file }}
          WORKER_BUILD_HASH: ${{ steps.preview-cache.outputs.worker_build_hash }}

      - name: Activate cached preview
        if: inputs.deploy-enabled && github.ref_name != 'deploy' && steps.preview-cache.outputs.cache_hit == 'true' && steps.preview-cache.outputs.shared_current != 'true'
        run: |
          OPEN_NEXT_DEPLOY=true pnpm exec wrangler versions deploy "$VERSION_ID@100%" --env preview --yes
          OPEN_NEXT_DEPLOY=true pnpm exec wrangler triggers deploy --env preview
          printf '%s' "$VERSION_ID" > "${SHARED_MARKER_FILE}.tmp"
          mv "${SHARED_MARKER_FILE}.tmp" "$SHARED_MARKER_FILE"
        working-directory: ${{ inputs.app-directory }}/apps/web
        env:
          VERSION_ID: ${{ steps.preview-cache.outputs.version_id }}
          SHARED_MARKER_FILE: ${{ steps.preview-cache.outputs.shared_marker_file }}

      - name: Migrate production Payload D1
        if: inputs.deploy-enabled && inputs.payload && github.ref_name == 'deploy'
        run: ${{ inputs.payload-production-migrate-command }}
        working-directory: ${{ inputs.app-directory }}/apps/web

      - name: Seed production Payload D1
        if: inputs.deploy-enabled && inputs.payload && inputs.payload-seed-production && github.ref_name == 'deploy'
        run: ${{ inputs.payload-production-seed-command }}
        working-directory: ${{ inputs.app-directory }}/apps/web

      - name: Deploy production
        if: inputs.deploy-enabled && github.ref_name == 'deploy'
        run: |
          set -o pipefail
          pnpm exec wrangler d1 execute NEXT_TAG_CACHE_D1 --remote --command "CREATE TABLE IF NOT EXISTS revalidations (tag TEXT NOT NULL, revalidatedAt INTEGER NOT NULL, stale INTEGER, expire INTEGER default NULL, UNIQUE(tag) ON CONFLICT REPLACE);" &
          D1_PID=$!

          upload_cache_file() {
            CACHE_FILE=$1
            RELATIVE_PATH=${CACHE_FILE#".open-next/cache/"}
            if [[ "$RELATIVE_PATH" == __fetch/* ]]; then
              RELATIVE_PATH=${RELATIVE_PATH#"__fetch/"}
              BUILD_ID=${RELATIVE_PATH%%/*}
              CACHE_KEY=/${RELATIVE_PATH#*/}
              CACHE_TYPE=fetch
            else
              BUILD_ID=${RELATIVE_PATH%%/*}
              CACHE_KEY=/${RELATIVE_PATH#*/}
              CACHE_KEY=${CACHE_KEY%.cache}
              CACHE_TYPE=cache
            fi
            CACHE_HASH=$(printf '%s' "$CACHE_KEY" | sha256sum | cut -d' ' -f1)
            R2_KEY="incremental-cache/$BUILD_ID/$CACHE_HASH.$CACHE_TYPE"
            pnpm exec wrangler r2 object put "$PRODUCTION_CACHE_BUCKET/$R2_KEY" --remote --file "$CACHE_FILE"
          }
          export -f upload_cache_file
          export PRODUCTION_CACHE_BUCKET
          # shellcheck disable=SC2016
          find .open-next/cache -type f -print0 | xargs -0 --no-run-if-empty --max-args=1 --max-procs="$(nproc)" bash -c 'upload_cache_file "$1"' _ &
          R2_PID=$!

          wait "$D1_PID"
          wait "$R2_PID"
          SECRETS_ARGUMENTS=()
          if [[ -n "${RUNTIME_SECRETS_FILE:-}" ]]; then
            SECRETS_ARGUMENTS=(--secrets-file "$RUNTIME_SECRETS_FILE")
          fi
          OPEN_NEXT_DEPLOY=true pnpm exec wrangler deploy "${SECRETS_ARGUMENTS[@]}"
        working-directory: ${{ inputs.app-directory }}/apps/web

      - name: Attach production custom domain
        if: inputs.deploy-enabled && github.ref_name == 'deploy' && inputs.production-custom-domain != ''
        run: |
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          HTTP_STATUS=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 1 --retry-max-time 30 --output "$RESPONSE_FILE" --write-out '%{http_code}' --request PUT --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" --header "Content-Type: application/json" --data "$(jq --null-input --arg hostname "$PRODUCTION_CUSTOM_DOMAIN" --arg service "$WORKER_NAME" '{hostname: $hostname, service: $service, override_existing_origin: true}')" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")
          if [[ "$HTTP_STATUS" != "200" ]] || ! jq --exit-status '.success == true' "$RESPONSE_FILE" >/dev/null; then
            echo "Cloudflare custom domain attachment failed with HTTP $HTTP_STATUS." >&2
            jq '{errors}' "$RESPONSE_FILE" >&2
            exit 1
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_CUSTOM_DOMAIN: ${{ inputs.production-custom-domain }}

      - name: Check deployed production
        if: inputs.deploy-enabled && github.ref_name == 'deploy' && inputs.production-health-url != ''
        run: curl --silent --show-error --fail --location --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 "$PRODUCTION_HEALTH_URL" --output /dev/null
        env:
          PRODUCTION_HEALTH_URL: ${{ inputs.production-health-url }}

      - name: Display preview URLs
        if: inputs.deploy-enabled && success() && github.ref_name != 'deploy'
        run: |
          SHARED_URL="https://$(printf '%s' "${SHARED_URL#https://}" | tr '[:lower:]' '[:upper:]')"
          PREVIEW_URL="https://$(printf '%s' "${PREVIEW_URL#https://}" | tr '[:lower:]' '[:upper:]')"
          ALIAS_URL="https://$(printf '%s' "${ALIAS_URL#https://}" | tr '[:lower:]' '[:upper:]')"
          {
            echo "## Preview Deployment"
            echo ""
            echo "- **Shared loggable Worker:** $SHARED_URL"
            echo "- **Version Preview URL (isolated, no logs):** $PREVIEW_URL"
            echo "- **Branch Alias URL (isolated, no logs):** $ALIAS_URL"
            echo ""
            echo "Reproduce server errors on the shared Worker, then run:"
            echo ""
            echo 'pnpm --dir ./*.cfworkers/apps/web logs:preview'
            echo ""
            echo "---"
            echo "_Branch:_ ${{ github.ref_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SHARED_URL: ${{ steps.preview-cache.outputs.shared_url || steps.deploy.outputs.shared_url }}
          PREVIEW_URL: ${{ steps.preview-cache.outputs.preview_url || steps.deploy.outputs.preview_url }}
          ALIAS_URL: ${{ steps.preview-cache.outputs.alias_url || steps.deploy.outputs.alias_url }}

      - name: Display production deployment
        if: inputs.deploy-enabled && success() && github.ref_name == 'deploy'
        run: |
          {
            echo "## Production Deployment"
            echo ""
            echo "Published ${{ github.sha }} from the deploy branch."
          } >> "$GITHUB_STEP_SUMMARY"
