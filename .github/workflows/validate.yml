name: Validate template

on:
  workflow_call:
    inputs:
      runner:
        description: JSON-encoded runner label or label array.
        required: false
        type: string
        default: '["self-hosted","win24-wsl"]'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            template.cfworkers

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Restore Next.js cache
        id: restore-next
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: template.cfworkers/apps/web/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('template.cfworkers/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('template.cfworkers/pnpm-lock.yaml') }}-
            ${{ runner.os }}-${{ runner.arch }}-nextjs-

      - name: Restore Playwright browsers
        id: restore-playwright
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('template.cfworkers/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir .pnpm-store
        working-directory: template.cfworkers

      - name: Check code
        run: pnpm check
        working-directory: template.cfworkers

      - name: Build application
        run: pnpm build
        working-directory: template.cfworkers

      - name: Build Cloudflare Worker
        run: pnpm --dir apps/web exec opennextjs-cloudflare build
        working-directory: template.cfworkers

      - name: Save Next.js cache
        if: steps.restore-next.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: template.cfworkers/apps/web/.next/cache
          key: ${{ steps.restore-next.outputs.cache-primary-key }}

      - name: Run unit tests
        run: pnpm test:unit
        working-directory: template.cfworkers

      - name: Install Playwright browsers
        if: steps.restore-playwright.outputs.cache-hit != 'true'
        run: pnpm --dir apps/web exec playwright install chromium webkit
        working-directory: template.cfworkers

      - name: Save Playwright browsers
        if: steps.restore-playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.restore-playwright.outputs.cache-primary-key }}

      - name: Run browser tests
        run: pnpm test:e2e
        working-directory: template.cfworkers
