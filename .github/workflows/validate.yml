name: Validate template

on:
  workflow_call:

permissions:
  contents: read

jobs:
  schedule:
    uses: ./.github/workflows/schedule-runner.yml

  validate:
    needs: schedule
    runs-on: [self-hosted, "${{ needs.schedule.outputs.runner-label }}"]
    timeout-minutes: 30
    env:
      PNPM_STORE_PATH: ${{ format('{0}/../../.pnpm-store', github.workspace) }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          clean: false
          sparse-checkout: |
            .github
            template.cfworkers

      - name: Setup Node.js
        if: runner.environment != 'self-hosted'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        if: runner.environment != 'self-hosted'
        run: corepack enable

      - name: Restore pnpm cache
        if: runner.environment != 'self-hosted'
        id: restore-pnpm
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-${{ hashFiles('template.cfworkers/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-

      - name: Restore Turborepo cache
        if: runner.environment != 'self-hosted'
        id: restore-turbo
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: template.cfworkers/.turbo
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-validate-${{ hashFiles('template.cfworkers/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-validate-${{ hashFiles('template.cfworkers/pnpm-lock.yaml') }}-
            ${{ runner.os }}-${{ runner.arch }}-turbo-

      - name: Restore Next.js cache
        if: runner.environment != 'self-hosted'
        id: restore-next
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: template.cfworkers/apps/web/.next/cache
          key: ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('template.cfworkers/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nextjs-${{ hashFiles('template.cfworkers/pnpm-lock.yaml') }}-
            ${{ runner.os }}-${{ runner.arch }}-nextjs-

      - name: Restore Playwright browsers
        if: runner.environment != 'self-hosted'
        id: restore-playwright
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('template.cfworkers/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: |
          INSTALL_INPUTS_HASH=$(
            {
              git ls-files --stage -- pnpm-lock.yaml pnpm-workspace.yaml .npmrc ':(glob)**/package.json' ':(glob)patches/**'
              node --version
              pnpm --version
            } | sha256sum | cut -d' ' -f1
          )
          INSTALL_MARKER="node_modules/.ci-install-${INSTALL_INPUTS_HASH}"
          if [[ "${{ runner.environment }}" == "self-hosted" && -f "$INSTALL_MARKER" ]]; then
            exit 0
          fi
          pnpm install --frozen-lockfile --prefer-offline --store-dir "$PNPM_STORE_PATH" ${{ steps.restore-pnpm.outputs.cache-hit == 'true' && '--offline' || '' }}
          if [[ "${{ runner.environment }}" == "self-hosted" ]]; then
            touch "$INSTALL_MARKER"
          fi
        working-directory: template.cfworkers

      - name: Use persistent Next.js cache
        if: runner.environment == 'self-hosted'
        run: |
          CACHE_DIRECTORY="/home/runner/_work/.build-cache/next/${GITHUB_REPOSITORY//\//-}"
          mkdir --parents "$CACHE_DIRECTORY" template.cfworkers/apps/web/.next
          ln --symbolic --force --no-dereference "$CACHE_DIRECTORY" template.cfworkers/apps/web/.next/cache

      - name: Validate, build, and run browser tests
        run: pnpm validate:ci
        working-directory: template.cfworkers

      - name: Save Next.js cache
        if: runner.environment != 'self-hosted' && steps.restore-next.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: template.cfworkers/apps/web/.next/cache
          key: ${{ steps.restore-next.outputs.cache-primary-key }}

      - name: Install Playwright browsers
        if: runner.environment != 'self-hosted' && steps.restore-playwright.outputs.cache-hit != 'true'
        run: pnpm --dir apps/web exec playwright install chromium webkit
        working-directory: template.cfworkers

      - name: Save Playwright browsers
        if: runner.environment != 'self-hosted' && steps.restore-playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.restore-playwright.outputs.cache-primary-key }}

      - name: Save pnpm cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: always() && runner.environment != 'self-hosted' && steps.restore-pnpm.outputs.cache-hit != 'true'
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ steps.restore-pnpm.outputs.cache-primary-key }}

      - name: Save Turborepo cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: success() && runner.environment != 'self-hosted' && steps.restore-turbo.outputs.cache-hit != 'true'
        with:
          path: template.cfworkers/.turbo
          key: ${{ steps.restore-turbo.outputs.cache-primary-key }}
