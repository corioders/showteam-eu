name: Validate template

on:
  workflow_call:
    inputs:
      runner:
        description: JSON-encoded runner label or label array.
        required: false
        type: string
        default: '["self-hosted","win24-wsl"]'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            showteam.cfworkers

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: showteam.cfworkers

      - name: Check code
        run: pnpm check
        working-directory: showteam.cfworkers

      - name: Migrate local D1
        run: pnpm migrate:local
        working-directory: showteam.cfworkers/apps/web

      - name: Seed local D1
        run: pnpm seed:local
        working-directory: showteam.cfworkers/apps/web

      - name: Build application
        run: pnpm build
        working-directory: showteam.cfworkers

      - name: Run unit tests
        run: pnpm test:unit
        working-directory: showteam.cfworkers

      - name: Install Playwright browsers
        run: pnpm --dir apps/web exec playwright install --with-deps chromium webkit
        working-directory: showteam.cfworkers

      - name: Run browser tests
        run: pnpm test:e2e
        working-directory: showteam.cfworkers
        env:
          PAYLOAD_SECRET: local-ci-secret

      - name: Build OpenNext Worker
        run: pnpm build:opennext
        working-directory: showteam.cfworkers/apps/web
