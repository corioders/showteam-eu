name: Infrastructure

on:
  pull_request:
    paths:
      - .github/workflows/infra.yml
      - showteam.cfworkers/infra/**
  push:
    branches: [deploy]
    paths:
      - .github/workflows/infra.yml
      - showteam.cfworkers/infra/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-production
  cancel-in-progress: false

env:
  TOFU_VERSION: 1.12.6

jobs:
  validate:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"blacksmith-4vcpu-ubuntu-2404"' || '["self-hosted","win24-wsl"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Check formatting
        run: tofu -chdir=showteam.cfworkers/infra fmt -check

      - name: Initialize without backend
        run: tofu -chdir=showteam.cfworkers/infra init -backend=false -input=false

      - name: Validate configuration
        run: tofu -chdir=showteam.cfworkers/infra validate

  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: [self-hosted, win24-wsl]
    timeout-minutes: 15
    environment: preview
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.TOFU_CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Initialize remote state
        run: tofu -chdir=showteam.cfworkers/infra init -input=false

      - name: Plan
        run: |
          set +e
          tofu -chdir=showteam.cfworkers/infra plan -input=false -lock-timeout=5m -detailed-exitcode
          exit_code=$?
          if [[ $exit_code -eq 1 ]]; then
            exit 1
          fi
          exit 0

  apply:
    if: github.ref == 'refs/heads/deploy' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: plan
    runs-on: [self-hosted, win24-wsl]
    timeout-minutes: 15
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.TOFU_CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Initialize remote state
        run: tofu -chdir=showteam.cfworkers/infra init -input=false

      - name: Apply reviewed infrastructure
        run: tofu -chdir=showteam.cfworkers/infra apply -input=false -lock-timeout=5m -auto-approve
