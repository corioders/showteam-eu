name: win24-wsl WoL smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, win24-wsl]
    timeout-minutes: 10
    steps:
      - name: Verify isolated Linux runner
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          docker info --format '{{.OSType}}' | grep -qx linux
