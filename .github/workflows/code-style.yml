name: Validate pull request

on: pull_request

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      # Never run untrusted fork code on the self-hosted runner.
      runner: ${{ github.event.pull_request.head.repo.full_name == github.repository && '["self-hosted","win24-wsl"]' || '"blacksmith-4vcpu-ubuntu-2404"' }}
