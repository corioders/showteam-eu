app_directory = "corioders-dashboard.cfworkers/apps/web"
preserve = "Telemetry collector, trace storage and observability UI"

[[consumer]]
repository = "corioders/corioders.com"
template_branch = "main"
app_directory = "corioders.cfworkers/apps/web"
preserve = "Lingui routing and typed env"
blocker = "Reconcile application bindings"

