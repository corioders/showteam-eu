packages:
  - "./packages/**"
  - "apps/*"

# Next is intentionally pinned immediately; keep pnpm's age policy for every other dependency.
minimumReleaseAgeExclude:
  - next
  - "@next/*"

overrides:
  uuid: 11.1.1

allowBuilds:
  "@biomejs/biome": true
  "@firebase/util": true
  "@tailwindcss/oxide": true
  esbuild: true
  lefthook: true
  lmdb: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
