packages:
  - "./packages/**"
  - "apps/*"

# Next is intentionally pinned immediately; keep pnpm's age policy for every other dependency.
minimumReleaseAgeExclude:
  - next
  - "@next/*"

overrides:
  uuid: 11.1.1

onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@firebase/util"
  - "@tailwindcss/oxide"
  - esbuild
  - lefthook
  - lmdb
  - msgpackr-extract
  - protobufjs
  - sharp
  - unrs-resolver
  - workerd
